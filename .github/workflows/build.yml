---
name: Build and Release

on:
  push:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - seeed_xiao_rp2040
          - seeed_xiao_rp2040_led
        example:
          - SineWaveSpeed
        include:
          - platform: seeed_xiao_rp2040
            example: FiftyPercent
          - platform: seeed_xiao_rp2040_led
            example: FiftyPercent
          - platform: seeed_xiao_rp2040
            example: RotaryEncoderWithBEMF
          - platform: seeed_xiao_rp2040_led
            example: RotaryEncoderWithBEMF
          - platform: seeed_xiao_rp2040_led
            example: MotorSerialDebug
          - platform: seeed_xiao_rp2040
            example: debugPWM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        env:
          PIOPROJECT_SRC_DIR: examples/${{ matrix.example }}
        run: pio run -e ${{ matrix.platform }}

      - name: Rename Firmware and Set Path
        id: rename
        run: |
          VERSION="${{ github.ref_name }}"
          SAFE_VERSION=$(echo "$VERSION" | tr '/' '-')
          FIRMWARE_BASENAME="xDuinoRails_MotorControl_bEMF-"
          FIRMWARE_BASENAME="${FIRMWARE_BASENAME}${SAFE_VERSION}-"
          FIRMWARE_BASENAME="${FIRMWARE_BASENAME}${{ matrix.example }}-"
          FIRMWARE_BASENAME="${FIRMWARE_BASENAME}${{ matrix.platform }}"
          BUILD_DIR=".pio/build/${{ matrix.platform }}"

          EXTENSION="uf2"

          mv "${BUILD_DIR}/firmware.${EXTENSION}" "${FIRMWARE_BASENAME}.${EXTENSION}"
          echo "firmware_glob=${FIRMWARE_BASENAME}.*" >> $GITHUB_OUTPUT

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.platform }}-${{ matrix.example }}
          path: |
            ${{ steps.rename.outputs.firmware_glob }}
            .pio/build/${{ matrix.platform }}/firmware.elf

  simulate:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # For now, only the debugPWM example has a corresponding simulation script.
        # This matrix can be expanded as more simulation tests are created.
        include:
          - platform: seeed_xiao_rp2040
            example: debugPWM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ matrix.platform }}-${{ matrix.example }}
          path: .pio/build/${{ matrix.platform }}

      - name: Install Renode
        run: |
          wget https://github.com/renode/renode/releases/download/v1.15.0/renode-1.15.0.linux-portable.tar.gz
          mkdir renode_portable
          tar -xzf renode-1.15.0.linux-portable.tar.gz -C renode_portable --strip-components=1
          chmod +x renode_portable/renode

      - name: Run Renode Simulation
        run: timeout 30s ./renode_portable/renode --disable-xwt -e 'i @test/Sim/rp2040_${{ matrix.example }}.resc' || true

#      - name: Rename VCD trace file
#        id: rename_vcd
#        run: |
#          VCD_FILENAME="trace-${{ matrix.platform }}-${{ matrix.example }}.vcd"
#          mv simulation.vcd "${VCD_FILENAME}"
#          echo "vcd_filename=${VCD_FILENAME}" >> $GITHUB_OUTPUT

#      - name: Upload VCD trace as artifact
#        uses: actions/upload-artifact@v4
#        with:
#          name: vcd-trace-${{ matrix.platform }}-${{ matrix.example }}
#          path: ${{ steps.rename_vcd.outputs.vcd_filename }}

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [build, simulate]
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*/*
